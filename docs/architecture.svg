<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">MCP Coding Tool architecture</title>
<desc id="desc">AI clients connect through optional HTTPS ingress to an authenticated Starlette and MCP server. It routes repository-bound tools through security policy and task orchestration to file-backed state, workstreams, CLI coding workers, independent verification, benchmarking and a dashboard.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  <style>
    .bg{fill:#f8fafc}.node{fill:#fff;stroke:#64748b;stroke-width:1.6;rx:14}.core{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:14}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:1.8;rx:14}.purple{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.7;rx:14}.muted{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5;rx:14}.title{font:700 22px Arial,sans-serif;fill:#0f172a}.sub{font:14px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#475569}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="bg" width="1200" height="1080" rx="20"/>
<text x="600" y="42" text-anchor="middle" class="title" style="font-size:28px">MCP Coding Tool — System Architecture</text>
<text x="600" y="68" text-anchor="middle" class="small">Model/client = reasoning · MCP service = controlled execution and orchestration</text>

<rect x="390" y="96" width="420" height="70" class="node"/>
<text x="600" y="124" text-anchor="middle" class="title">AI Coding Client</text>
<text x="600" y="146" text-anchor="middle" class="sub">ChatGPT Web · other MCP clients</text>
