<rect x="390" y="204" width="420" height="62" class="muted"/>
<text x="600" y="229" text-anchor="middle" class="title">Optional HTTPS Ingress</text>
<text x="600" y="249" text-anchor="middle" class="sub">Cloudflare Tunnel / ngrok · not an auth boundary</text>
<path class="line" d="M600 266 V302"/>
<rect x="260" y="304" width="680" height="90" class="core"/>
<text x="600" y="334" text-anchor="middle" class="title">ASGI + MCP Server · app/main.py</text>
<text x="600" y="357" text-anchor="middle" class="sub">Starlette routes · MCP tool registration · Bearer middleware</text>
<text x="600" y="377" text-anchor="middle" class="sub">Health · Tool catalog · Dashboard / API</text>
<path class="line" d="M600 394 V430"/>
<rect x="310" y="432" width="580" height="72" class="node"/>
<text x="600" y="459" text-anchor="middle" class="title">Session &amp; Repository Context</text>
<text x="600" y="482" text-anchor="middle" class="sub">Registered repositories · active workspace selection</text>

<path class="line" d="M600 504 V534 H210 V560"/>
<path class="line" d="M600 534 H600 V560"/>
<path class="line" d="M600 534 H990 V560"/>
<rect x="55" y="562" width="310" height="108" class="green"/>
<text x="210" y="591" text-anchor="middle" class="title">Policy-Aware Tools</text>
<text x="210" y="614" text-anchor="middle" class="sub">Files · editing · search · code intelligence</text>
<text x="210" y="636" text-anchor="middle" class="sub">Terminal · Git · repository analysis</text>
<text x="210" y="655" text-anchor="middle" class="small">Canonical paths · secrets · command policy</text>
<rect x="445" y="562" width="310" height="108" class="purple"/>
<text x="600" y="591" text-anchor="middle" class="title">Task Orchestrator</text>
<text x="600" y="614" text-anchor="middle" class="sub">Task plans · phases · repair loops</text>
<text x="600" y="636" text-anchor="middle" class="sub">Skills · hooks · checkpoints · approvals</text>
<text x="600" y="655" text-anchor="middle" class="small">Workstream coordination</text>
<rect x="835" y="562" width="310" height="108" class="node"/>
<text x="990" y="591" text-anchor="middle" class="title">Observability UI</text>
<text x="990" y="614" text-anchor="middle" class="sub">Dashboard · tasks · approvals · events</text>
<text x="990" y="636" text-anchor="middle" class="sub">Checkpoints · diffs · recovery actions</text>
<text x="990" y="655" text-anchor="middle" class="small">Protected by auth when enabled</text>

<path class="line" d="M210 670 V708"/>
<rect x="55" y="710" width="310" height="92" class="node"/>
<text x="210" y="739" text-anchor="middle" class="title">Repository Workspaces</text>
<text x="210" y="762" text-anchor="middle" class="sub">Registered local Git repositories</text>
