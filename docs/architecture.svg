<text x="600" y="762" text-anchor="middle" class="sub">Configured CLI processes · isolated worktrees</text>
<text x="600" y="783" text-anchor="middle" class="small">Timeout · cancellation · logs · redaction</text>
<path class="line" d="M990 670 V708"/>
<rect x="835" y="710" width="310" height="92" class="muted"/>
<text x="990" y="739" text-anchor="middle" class="title">Local Runtime State</text>
<text x="990" y="762" text-anchor="middle" class="sub">JSON task/job/approval/audit records</text>
<text x="990" y="783" text-anchor="middle" class="small">Evidence · checkpoints · benchmark runs</text>

<path class="line" d="M600 802 V838 H300 V858"/>
<path class="line" d="M600 838 V858"/>
<path class="line" d="M600 838 H900 V858"/>
<rect x="70" y="860" width="460" height="104" class="green"/>
<text x="300" y="889" text-anchor="middle" class="title">Independent Verification</text>
<text x="300" y="912" text-anchor="middle" class="sub">Fresh-process tests / lint · revision stability</text>
<text x="300" y="934" text-anchor="middle" class="small">Persisted evidence IDs; no reliance on worker claims</text>
<rect x="550" y="860" width="300" height="104" class="purple"/>
<text x="700" y="889" text-anchor="middle" class="title">Benchmark Harness</text>
<text x="700" y="912" text-anchor="middle" class="sub">Same cases · baseline revisions</text>
<text x="700" y="934" text-anchor="middle" class="small">Verified outcomes · unknown cost stays null</text>
<rect x="870" y="860" width="260" height="104" class="node"/>
<text x="1000" y="889" text-anchor="middle" class="title">Git Delivery Gates</text>
<text x="1000" y="912" text-anchor="middle" class="sub">Review · approval · push/merge</text>
<text x="1000" y="934" text-anchor="middle" class="small">Never auto-merge worker output</text>
<text x="600" y="1025" text-anchor="middle" class="small">Security note: permission checks complement, but do not replace, operating-system/container isolation.</text>
</svg>